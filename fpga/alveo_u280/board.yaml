# Alveo U280 FPGA board / platform overlay for Tiny-Vedas.
board: alveo_u280
part: xcu280-fsvh2892-2L-e
vivado_version: "2023.2"

# 8192 words = 32 KiB ICCM; 65536 x 128-bit lines = 1 MiB DCCM
synth_iccm_depth_words: 8192
synth_dccm_depth_words: 65536

qdma:
  link_width: x16
  link_speed_gts: 8.0
  axi_clock_mhz: 250
  core_clock_mhz: 80
  axil_bar: 2
  axil_bar_size: 0x200000
  ctrl_offset: 0x0000
  ctrl_size: 0x1000
  iccm_offset: 0x1000
  iccm_size: 0x8000
  dccm_offset: 0x9000
  dccm_size: 0x100000

# Clocks:
#   QDMA axi_aclk ~250 MHz — AXI-Lite, host ICCM/DCCM port, CTRL
#   MMCM → core_clk 80 MHz — Tiny-Vedas core + core mem port + GEMM
# CDC: SVLib cdc_sync (levels + UART/EOT/host-mem req/ack toggles)
#
# BAR2 (2 MiB):
#   0x0000 CTRL  (4 KiB)
#   0x1000 ICCM  (32 KiB / 8192 words)
#   0x9000 DCCM  (1 MiB / 65536 x 128-bit lines)
#   end    0x109000 (unused to 0x200000)
#
# CTRL:
#   0x00 VERSION (0x000B0014), 0x04 SCRATCH, 0x08 HEARTBEAT
#   0x0C CORE_CTRL [0]=core_run [1]=mmcm_locked
#   0x10 RESET_VECTOR, 0x14 STATUS eot_done, 0x18 EOT_CLEAR
#   0x1C UART_STATUS, 0x20 UART_POP, 0x24 UART_CLEAR
#   0x28 DRAM_WIN (byte offset), 0x2C DRAM_SEL [0]=remap DCCM window onto stub
# Pass = EOT (+ optional UART golden). No retire TRACE on FPGA.
